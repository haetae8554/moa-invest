<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>모아 종목 연결</title><link rel="stylesheet" href="popup.css"><script src="protocol.js" defer></script><script src="popup.js" defer></script></head><body>
<h1>토스 ↔ 모아</h1><p class="muted">종목을 자동으로 찾아 연결해요. 같은 창에 토스·모아 탭이 하나씩 있으면 탭도 자동 연결돼요.</p>
<label for="toss">토스 탭</label><select id="toss"></select>
<label for="moa">모아 탭</label><select id="moa"></select>
<button id="connect" class="primary">두 탭 연결하기</button><button id="pause">연결 일시정지</button>
<p id="status" role="status">열린 탭을 찾는 중…</p>
<p id="mapping-count" class="muted"></p><button id="refresh">종목 정보 다시 조회</button>
<p class="muted foot">최초 연결은 토스 종목을 모아에 적용해요. 여러 탭을 열었을 때만 위에서 사용할 탭을 고르세요. 주문 입력·전송은 동기화하지 않아요.</p>
</body></html>
