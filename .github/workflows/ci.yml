name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: python scripts/check_public_tree.py
      - run: python -m unittest discover -s tests -q
      - run: node --test tests/test_symbol_sync.cjs
      - run: node --test tests/test_launcher.cjs
      - run: node --test tests/test_sidepanel.cjs
      - run: node --test tests/test_demo.cjs
      - run: python scripts/build_release.py
      - if: runner.os == 'Windows'
        run: python -m pip install -r requirements-build.txt
      - if: runner.os == 'Windows'
        run: python scripts/build_release.py --windows
      - run: node --check order_ui/static/app.js
      - run: node --check order_ui/static/panel-bridge.js
      - run: node --check browser_extension/sidepanel.js
      - run: node --check browser_extension/popup.js
