name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: python scripts/check_public_tree.py
      - run: python -m unittest discover -s tests -q
      - run: node --test tests/test_symbol_sync.cjs
      - run: node --test tests/test_launcher.cjs
      - run: node --test tests/test_sidepanel.cjs
      - run: node --test tests/test_demo.cjs
      - run: python scripts/build_release.py
      - if: runner.os == 'Windows'
        run: python -m pip install -r requirements-build.txt
      - if: runner.os == 'Windows'
        run: python scripts/build_release.py --windows
      - run: node --check order_ui/static/app.js
      - run: node --check order_ui/static/panel-bridge.js
      - run: node --check browser_extension/sidepanel.js
      - run: node --check browser_extension/popup.js
