name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: python scripts/check_public_tree.py
      - run: python -m unittest discover -s tests -q
      - run: node --test tests/test_symbol_sync.cjs
      - run: node --check order_ui/static/app.js
      - run: node --check order_ui/static/panel-bridge.js
      - run: node --check browser_extension/sidepanel.js
      - run: node --check browser_extension/popup.js
